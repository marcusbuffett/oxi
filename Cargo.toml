[package]
name = "oxi"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oxi"
path = "src/main.rs"

[dependencies]
burn = { git = "https://github.com/tracel-ai/burn", branch = "main", default-features = false, features = ["std"] }
burn-train = { git = "https://github.com/tracel-ai/burn", branch = "main", default-features = false, features = ["tui"], optional = true }

burn-ndarray = { git = "https://github.com/tracel-ai/burn", branch = "main", optional = true }
burn-tch = { git = "https://github.com/tracel-ai/burn", branch = "main", default-features = false, optional = true }
burn-cuda = { git = "https://github.com/tracel-ai/burn", branch = "main", optional = true }
burn-candle = { git = "https://github.com/tracel-ai/burn", branch = "main", optional = true }

clap = { version = "*", features = ["derive"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde_yaml = "*"
shakmaty = "0.29"
pgn-reader = { git = "https://github.com/marcusbuffett/rust-pgn-reader", branch = "master" }
tokio = { version = "*", features = ["full"] }
indicatif = "*"
anyhow = "*"
tracing = "*"
tracing-subscriber = "*"
tracing-appender = "*"
reqwest = { version = "*", features = ["json", "stream"] }
flate2 = "*"
zstd = "*"
once_cell = "*"
futures-util = "*"
num_cpus = "*"
rand = "0.9"
statrs = "*"
itertools = "*"
rayon = "*"
bincode = "2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
zip = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls"], default-features = false }

[dev-dependencies]
tempfile = "*"
burn-autodiff = { git = "https://github.com/tracel-ai/burn", branch = "main" }
insta = "*"

[features]
default = []
train = ["burn/train", "burn/autodiff", "burn-train"]
backend-ndarray = ["burn-ndarray"]
backend-tch = ["burn-tch", "burn/tch"]
backend-cuda = ["burn-cuda", "burn/cuda", "burn/fusion", "burn/autotune"]
backend-candle = ["burn-candle"]
backend-candle-cuda = ["backend-candle", "burn-candle/cuda", "burn/candle-cuda"]
backend-candle-metal = ["backend-candle", "burn-candle/metal"]
backend-wgpu = ["burn/wgpu"]
backend-metal = ["backend-wgpu", "burn/metal", "burn/fusion"]

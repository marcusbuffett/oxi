[project]
name = "oxi"
version = "0.1.0"
description = "Hyperparameter optimization for Oxi chess engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "optuna>=3.3.0",
    "optuna-dashboard>=0.13.0",
    "psutil>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88
target-version = ['py312']
